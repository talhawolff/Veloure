<!doctype html>
<html lang="en" class="light">
  <head>
    <script>
      (function () {
        try {
          if (typeof window !== 'undefined') {
            if (!window.global) {
              window.global = window;
            }
            var _realFetch = window.fetch;
            var _currentFetch = _realFetch ? _realFetch.bind(window) : undefined;
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return _currentFetch;
              },
              set: function (v) {
                _currentFetch = v;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch descriptor polyfill warning:', e);
        }
      })();
    </script>
